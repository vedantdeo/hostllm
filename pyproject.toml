[project]
name = "hostllm"
version = "0.1.0"
description = "A from-scratch, OpenAI-compatible server for a causal LM and its LoRA adapters, measured against vLLM."
readme = "README.md"
authors = [
    { name = "vedantdeo", email = "vedantdeo1@gmail.com" }
]
requires-python = ">=3.12"
# None: config and pricing need only the standard library, so a consumer such as underhood can price
# a served call without installing torch. What the engine needs is in the serve group, which every
# `uv sync` here installs by default, and no consumer does.
dependencies = []

[project.scripts]
hostllm-serve = "hostllm.server:main"
hostllm-bench = "hostllm.bench:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
deploy = [
    "modal>=1.1",
]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
serve = [
    "peft>=0.21.2",
    "torch>=2.14",
    "transformers>=5.17",
]

[tool.uv]
default-groups = ["deploy", "dev", "serve"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "A"]

[tool.pyright]
exclude = [".venv"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
